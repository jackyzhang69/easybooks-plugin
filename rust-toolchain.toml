[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
# Cross-compile targets used by scripts/build-local.sh and .github/workflows/publish.yml.
# (rustup installs these on demand; listing them keeps the toolchain reproducible.)
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-gnu",
]
