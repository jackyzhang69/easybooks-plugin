name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  plugin-version-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Require version bump when plugin paths change
        run: bash scripts/assert-plugin-version-bumped.sh

  test:
    # CI is credential-free and must not depend on a repository-scoped signing
    # runner being online. The tag release remains pinned to the dedicated 69
    # signing runner.
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_AR: ar
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Tool versions
        run: |
          rustc --version && cargo --version

      - name: Skills mirror lock-step (.claude/skills == .agents/skills)
        run: |
          bash scripts/sync-skills.sh
          python3 scripts/assert_skill_command_contract.py

      - name: Version metadata lock-step
        run: |
          python3 -m py_compile scripts/assert_plugin_version.py plugin-metadata/scripts/verify-install
          python3 scripts/assert_plugin_version.py --root .
          python3 - <<'PY'
          from pathlib import Path
          source = Path("plugin-metadata/scripts/verify-install").read_text()
          assert '[str(binary), "--json", "doctor", "--no-fetch"]' in source
          assert '[str(binary), "doctor", "--json", "--no-fetch"]' not in source
          PY

      - name: Read platform governance pin
        id: platform_governance_pin
        run: echo "sha=$(tr -d '[:space:]' < scripts/official-plugin/PLATFORM_GOVERNANCE_REV)" >> "$GITHUB_OUTPUT"

      - name: Checkout platform governance
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: jackyzhang69/platform
          ref: ${{ steps.platform_governance_pin.outputs.sha }}
          path: .platform-governance

      - name: Verify plugin identity (platform registry)
        env:
          PLATFORM_GOVERNANCE_ROOT: ${{ github.workspace }}/.platform-governance
        run: |
          bash scripts/official-plugin/stage-identity-package.sh "$(pwd)/dist/identity-package"
          bash scripts/official-plugin/verify-plugin-identity.sh "$(pwd)/dist/identity-package"

      - name: Cargo build (release)
        run: cargo build --release

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Cargo test (release)
        run: cargo test --release --all-targets 2>&1 | tee /tmp/cargo-test.log

      - name: Skill surface vs built binary
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/easybooks"
          python3 scripts/official-plugin/assert-skill-surface.py \
            --bin "$BIN" \
            --skills "$(pwd)/.claude/skills/easybooks"
          python3 scripts/assert_skill_command_contract.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
