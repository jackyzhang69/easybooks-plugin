name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # CI is credential-free and must not depend on a repository-scoped signing
    # runner being online. The tag release remains pinned to the dedicated 69
    # signing runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Tool versions
        run: |
          rustc --version && cargo --version

      - name: Skills mirror lock-step (.claude/skills == .agents/skills)
        run: bash scripts/sync-skills.sh

      - name: Version metadata lock-step
        run: |
          python3 -m py_compile scripts/assert_plugin_version.py plugin-metadata/scripts/verify-install
          python3 scripts/assert_plugin_version.py --root .

      - name: Cargo build (release)
        run: cargo build --release

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Cargo test (release)
        run: cargo test --release --all-targets 2>&1 | tee /tmp/cargo-test.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
