name: build-sign-plugin

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:

concurrency:
  group: easybooks-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: [self-hosted, macOS, ARM64, easybooks-plugin-signing]
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      STAGE: /tmp/easybooks-plugin-build-stage
      IS_TAG: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Ensure Rust targets
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-gnu
          test -x /opt/homebrew/bin/x86_64-w64-mingw32-gcc
          /opt/homebrew/bin/x86_64-w64-mingw32-gcc --version >/dev/null

      - name: Verify tag and source version
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          bash scripts/assert-plugin-version-bumped.sh
          python3 scripts/assert_plugin_version.py --tag "$VERSION" --root .

      - name: Verify source
        run: |
          set -euo pipefail
          bash scripts/sync-skills.sh
          "$HOME/.cargo/bin/cargo" clippy --workspace --all-targets -- -D warnings
          "$HOME/.cargo/bin/cargo" test --workspace --all-targets
          "$HOME/.cargo/bin/cargo" build --release --bin easybooks
          BIN="$("$HOME/.cargo/bin/cargo" metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/release/easybooks"
          python3 scripts/assert-skill-surface.py \
            --bin "$BIN" \
            --skills "$(pwd)/.claude/skills/easybooks"

      - name: Build release binaries
        run: |
          set -euo pipefail
          "$HOME/.cargo/bin/cargo" build --release --target aarch64-apple-darwin --bin easybooks
          "$HOME/.cargo/bin/cargo" build --release --target x86_64-pc-windows-gnu --bin easybooks

      - name: Require signing configuration
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CODESIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_NOTARIZE_PASS"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"

      - name: Bootstrap isolated signing keychain
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/easybooks-plugin-signing-${GITHUB_RUN_ID}.keychain-db"
          P12="$RUNNER_TEMP/easybooks-plugin-certificate-${GITHUB_RUN_ID}.p12"
          ORIG_DEFAULT="$RUNNER_TEMP/easybooks-plugin-orig-default-${GITHUB_RUN_ID}"
          ORIG_SEARCH="$RUNNER_TEMP/easybooks-plugin-orig-search-${GITHUB_RUN_ID}"
          KC_PW="$(openssl rand -base64 24)"
          security default-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$ORIG_DEFAULT" || true
          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$ORIG_SEARCH" || true
          printf '%s' "$CSC_LINK" | openssl base64 -d -A > "$P12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -ut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          rm -f "$P12"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/${ca}.cer" -o "$RUNNER_TEMP/${ca}-${GITHUB_RUN_ID}.cer"
            security import "$RUNNER_TEMP/${ca}-${GITHUB_RUN_ID}.cer" -k "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/${ca}-${GITHUB_RUN_ID}.cer"
          done
          existing=()
          while IFS= read -r kc; do [ -n "$kc" ] && existing+=("$kc"); done < "$ORIG_SEARCH"
          if [ "${#existing[@]}" -gt 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN"
          fi
          IDENTITY_HASH="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY" | grep -oE '[0-9A-Fa-f]{40}' | head -1)"
          if ! printf '%s' "$IDENTITY_HASH" | grep -qE '^[0-9A-Fa-f]{40}$'; then
            echo "::error::No unambiguous governed Developer ID identity was found in the isolated keychain" >&2
            exit 1
          fi
          {
            echo "EASYBOOKS_KEYCHAIN=$KEYCHAIN"
            echo "EASYBOOKS_ORIG_DEFAULT=$ORIG_DEFAULT"
            echo "EASYBOOKS_ORIG_SEARCH=$ORIG_SEARCH"
            echo "CODESIGN_IDENTITY=$IDENTITY_HASH"
          } >> "$GITHUB_ENV"
          PROBE="$RUNNER_TEMP/easybooks-codesign-probe-${GITHUB_RUN_ID}"
          cp /bin/echo "$PROBE"
          codesign --force --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY_HASH" "$PROBE"
          codesign --verify --strict "$PROBE"
          rm -f "$PROBE"

      - name: Assemble and sign stage
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          mkdir -p "$STAGE/cli-aarch64-apple-darwin" "$STAGE/cli-x86_64-pc-windows-gnu"
          cp target/aarch64-apple-darwin/release/easybooks "$STAGE/cli-aarch64-apple-darwin/easybooks"
          cp target/x86_64-pc-windows-gnu/release/easybooks.exe "$STAGE/cli-x86_64-pc-windows-gnu/easybooks.exe"
          chmod +x "$STAGE/cli-aarch64-apple-darwin/easybooks"
          codesign --force --options runtime --timestamp --keychain "$EASYBOOKS_KEYCHAIN" --sign "$CODESIGN_IDENTITY" "$STAGE/cli-aarch64-apple-darwin/easybooks"
          codesign --verify --strict --verbose=2 "$STAGE/cli-aarch64-apple-darwin/easybooks"
          if [ "$IS_TAG" = "true" ]; then
            python3 scripts/assert_plugin_version.py --tag "$VERSION" --root . --binary "$STAGE/cli-aarch64-apple-darwin/easybooks"
          else
            python3 scripts/assert_plugin_version.py --root . --binary "$STAGE/cli-aarch64-apple-darwin/easybooks"
          fi

      - name: Notarize macOS binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/easybooks-notarize.zip"
          ditto -c -k --keepParent "$STAGE/cli-aarch64-apple-darwin/easybooks" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASS" \
            --wait

      - name: Seal immutable signed stage
        run: |
          set -euo pipefail
          (
            cd "$STAGE"
            shasum -a 256 cli-aarch64-apple-darwin/easybooks > cli-aarch64-apple-darwin/easybooks.sha256
            shasum -a 256 cli-x86_64-pc-windows-gnu/easybooks.exe > cli-x86_64-pc-windows-gnu/easybooks.exe.sha256
            tar czf easybooks-cli-signed-stage.tar.gz cli-aarch64-apple-darwin cli-x86_64-pc-windows-gnu
            shasum -a 256 easybooks-cli-signed-stage.tar.gz > easybooks-cli-signed-stage.tar.gz.sha256
          )

      - name: Publish source-provenance release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "$STAGE/easybooks-cli-signed-stage.tar.gz"
            "$STAGE/easybooks-cli-signed-stage.tar.gz.sha256"
          )
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::immutable release already exists for $VERSION"
            exit 1
          fi
          gh release create "$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "EasyBooks CLI $VERSION" \
            --notes "Signed EasyBooks plugin stage built from immutable source ${{ github.sha }}."

      - name: Load plugins deploy key
        if: env.IS_TAG == 'true'
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.PLUGINS_REPO_DEPLOY_KEY }}
      - name: Official marketplace publish
        if: env.IS_TAG == 'true'
        env:
          PLUGINS_REPO_DEPLOY_KEY: ${{ secrets.PLUGINS_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash scripts/assemble-official-plugin.sh "$STAGE" "$RUNNER_TEMP/easybooks-cli"
          git clone --branch main "git@github.com:jackyzhang69/plugins.git" "$RUNNER_TEMP/plugins-repo"
          python3 scripts/official-plugin/publish-official-plugin.py \
            --plugin-id easybooks \
            --staged "$RUNNER_TEMP/easybooks-cli" \
            --marketplace "$RUNNER_TEMP/plugins-repo" \
            --apply --git-push

      - name: Teardown isolated signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${EASYBOOKS_KEYCHAIN:-$RUNNER_TEMP/easybooks-plugin-signing-${GITHUB_RUN_ID}.keychain-db}"
          ORIG_DEFAULT_PATH="${EASYBOOKS_ORIG_DEFAULT:-$RUNNER_TEMP/easybooks-plugin-orig-default-${GITHUB_RUN_ID}}"
          ORIG_SEARCH_PATH="${EASYBOOKS_ORIG_SEARCH:-$RUNNER_TEMP/easybooks-plugin-orig-search-${GITHUB_RUN_ID}}"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          if [ -s "$ORIG_DEFAULT_PATH" ]; then
            security default-keychain -s "$(cat "$ORIG_DEFAULT_PATH")" 2>/dev/null || true
          fi
          if [ -s "$ORIG_SEARCH_PATH" ]; then
            orig=()
            while IFS= read -r kc; do [ -n "$kc" ] && orig+=("$kc"); done < "$ORIG_SEARCH_PATH"
            [ "${#orig[@]}" -gt 0 ] && security list-keychains -d user -s "${orig[@]}" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/easybooks-plugin-certificate-${GITHUB_RUN_ID}.p12" \
            "$ORIG_DEFAULT_PATH" "$ORIG_SEARCH_PATH" 2>/dev/null || true
