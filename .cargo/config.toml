# Compile the shared crate from the pinned vendor snapshot. Cargo.toml still
# records the platform git rev; scripts/official-plugin/seed-jz-plugin-common.sh
# verifies vendor/jz-plugin-common matches that rev. CI cannot SSH to the
# private platform repository.
[patch."ssh://git@github.com/jackyzhang69/platform.git"]
jz-plugin-common = { path = "vendor/jz-plugin-common" }
